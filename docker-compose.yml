services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

  migrate:
    image: base-for-tg-bots-backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL_ALEMBIC: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: base-for-tg-bots-backend:local
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      BOT_ENABLED: ${BOT_ENABLED:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/telegram}
      WEBAPP_URL: ${WEBAPP_URL:-http://localhost:8081}
      TELEGRAM_SECRET: ${TELEGRAM_SECRET:-}
      DROP_PENDING: ${DROP_PENDING:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-db}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      BOT_CACHE_PATH: /app/data/bot_cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - backend

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:
  bot_data:

networks:
  backend:
    driver: bridge
